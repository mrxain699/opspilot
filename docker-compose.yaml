services:
  postgres:
    image: postgres:17
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - opspilot_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: opspilot-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  opspilot_postgres_data:
